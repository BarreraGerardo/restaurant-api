# ==========================================
# APLICACION Y SERVIDOR
# ==========================================
spring.application.name=restaurant-api
server.port=8081

# ==========================================
# BASE DE DATOS (POSTGRESQL / PGADMIN)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurante_db
spring.datasource.username=postgres
spring.datasource.password=gbg18062003
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# JPA / HIBERNATE
# ==========================================
# Crea y actualiza tablas automaticamente segun tus entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# SEGURIDAD / JWT (PARA DIA 3)
# ==========================================
spring.security.user.name=admin
spring.security.user.password=admin123
# Usa una clave secreta larga (minimo 256 bits / 32+ caracteres) al implementar JWT
app.jwt.secret=cambiaEstaClaveSecretaPorUnaMuyLargaYSeguraDeAlMenos32Caracteres2026
app.jwt.expiration-ms=86400000

# ==========================================
# SWAGGER / OPENAPI (PARA DIA 4)
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha